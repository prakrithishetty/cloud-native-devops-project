services:
  database:
    image: postgres:16
    container_name: devops-postgres
    environment:
      POSTGRES_DB: devopsdb
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devopsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: devops-flask-app
    environment:
      APP_NAME: "Cloud-Native DevOps Platform"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "development"
      DATABASE_URL: "postgresql://devops:devops_password@database:5432/devopsdb"
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: devops-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
